<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#002f59"/>
      <stop offset="100%" stop-color="#004a8f"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f4ff"/>
    </linearGradient>
  </defs>
  <!-- Fond carré arrondi -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Accent bar en haut -->
  <rect x="0" y="0" width="32" height="3" rx="3" fill="#ff7631" opacity="0.85"/>
  <!-- Croix médicale -->
  <rect x="13" y="6" width="6" height="20" rx="2.5" fill="url(#cross)"/>
  <rect x="6" y="13" width="20" height="6" rx="2.5" fill="url(#cross)"/>
</svg>
